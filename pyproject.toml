[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-game-cracker"
version = "1.0.0"
description = "Steam Game Cracker CLI/TUI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.0",
]

[project.scripts]
steam-game-cracker = "steam_game_cracker.cli:main"
steam-game-cracker-tui = "steam_game_cracker.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["env", ".venv", "build", "dist", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["B904", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["steam_game_cracker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
